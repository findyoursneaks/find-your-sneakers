name: Build verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://iwbrmjchqcpvcvvrgfvh.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_XB79v_WDUxiI-0LH2NixeQ_H0Rt70O1
        run: npm run build
      - name: Deploy production to Netlify
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          OIDC_RESPONSE="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=solewar-netlify-deploy")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | jq -r '.value')"
          test -n "$OIDC_TOKEN"
          test "$OIDC_TOKEN" != "null"
          PROXY_URL="$(curl -fsSL -H "Authorization: Bearer $OIDC_TOKEN" "https://iwbrmjchqcpvcvvrgfvh.supabase.co/functions/v1/netlify-deploy-token")"
          test -n "$PROXY_URL"
          npx -y @netlify/mcp@latest --site-id 5cfcd38c-eaae-47b9-a8e4-f9f115f37477 --proxy-path "$PROXY_URL"
