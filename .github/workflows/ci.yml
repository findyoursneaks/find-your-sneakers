name: Build verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://iwbrmjchqcpvcvvrgfvh.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_XB79v_WDUxiI-0LH2NixeQ_H0Rt70O1
        run: npm run build
      - name: Package source for deployment handoff
        run: tar --exclude=.git --exclude=node_modules --exclude=.next -czf solewar-source.tgz .
      - name: Upload deployment source
        uses: actions/upload-artifact@v4
        with:
          name: solewar-deploy-source
          path: solewar-source.tgz
          retention-days: 1
