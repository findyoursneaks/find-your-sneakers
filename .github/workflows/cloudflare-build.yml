name: Cloudflare build check

on:
  push:
    branches:
      - cloudflare-rebuild
  pull_request:
    branches:
      - cloudflare-rebuild

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build SOLEWAR for Cloudflare
        run: npm run build
