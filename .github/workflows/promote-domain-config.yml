name: Promote Cloudflare domain config

on:
  push:
    branches:
      - datefix
    paths:
      - .github/workflows/promote-domain-config.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Promote domain configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/cloudflare-rebuild" -f sha="$GITHUB_SHA" -F force=true
