name: Verify SOLEWAR production

on:
  push:
    paths:
      - '.github/workflows/verify-vercel.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel and verify homepage
        shell: bash
        run: |
          set -euo pipefail
          URL="https://solewar-production-findyoursneaks.vercel.app"
          for i in {1..18}; do
            code="$(curl -L -sS -o /tmp/home.html -w "%{http_code}" "$URL" || true)"
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ] && grep -qi "SOLEWAR" /tmp/home.html; then
              echo "Homepage OK"
              break
            fi
            sleep 10
          done
          test "$(curl -L -sS -o /tmp/home.html -w "%{http_code}" "$URL")" = "200"
          grep -qi "SOLEWAR" /tmp/home.html
      - name: Verify outdoor catalog
        shell: bash
        run: |
          set -euo pipefail
          URL="https://solewar-production-findyoursneaks.vercel.app/outdoor"
          code="$(curl -L -sS -o /tmp/outdoor.html -w "%{http_code}" "$URL")"
          echo "Outdoor HTTP $code"
          test "$code" = "200"
          echo '--- OUTDOOR BODY SNIPPET ---'
          head -c 3000 /tmp/outdoor.html
          echo
          grep -qi "Moosehill" /tmp/outdoor.html
          grep -qi "SAS15" /tmp/outdoor.html
